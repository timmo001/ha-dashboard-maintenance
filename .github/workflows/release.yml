    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: timmo001/workflows/.github/workflows/ha-card-release.yml@942a2e735c957787562e621d916fb6f78c9bb508 # 20261009.0
    with:
      attest: true
      dist-glob: "dist/ha-dashboard-maintenance.js"
    permissions:
      contents: write
      id-token: write
      attestations: write
