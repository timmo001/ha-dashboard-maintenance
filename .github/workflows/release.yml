jobs:
  release:
    uses: timmo001/workflows/.github/workflows/ha-card-release.yml@f72d1eb6c310502499f5551d65ceca1e478eb266 # 20261003.0
    with:
      attest: true
      dist-glob: "dist/ha-dashboard-maintenance.js"
    permissions:
      contents: write
      id-token: write
      attestations: write
