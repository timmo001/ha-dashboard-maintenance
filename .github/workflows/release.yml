    uses: timmo001/workflows/.github/workflows/ha-card-release.yml@13dce11f125107b83ea662167f1091d070dcd359 # 20261114.0
    with:
      attest: true
      dist-glob: "dist/ha-dashboard-maintenance.js"
    permissions:
      contents: write
      id-token: write
      attestations: write
