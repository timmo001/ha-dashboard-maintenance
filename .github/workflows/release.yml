jobs:
  release:
    uses: timmo001/workflows/.github/workflows/ha-card-release.yml@f8d0daf26e163f0ee997d759fbf0f7daeb598c43 # 20261008.2
    with:
      attest: true
      dist-glob: "dist/ha-dashboard-maintenance.js"
    permissions:
      contents: write
      id-token: write
      attestations: write
