    uses: timmo001/workflows/.github/workflows/ha-card-release.yml@9bb6ae3c2a1542cec4195b63f9516c83001e578e # 20261113.0
    with:
      attest: true
      dist-glob: "dist/ha-dashboard-maintenance.js"
    permissions:
      contents: write
      id-token: write
      attestations: write
