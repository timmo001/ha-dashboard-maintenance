jobs:
  release:
    uses: timmo001/workflows/.github/workflows/ha-card-release.yml@fcc6d0528cf0533614d1162c5c5b8ebbb6dfdad5 # 20261008.1
    with:
      attest: true
      dist-glob: "dist/ha-dashboard-maintenance.js"
    permissions:
      contents: write
      id-token: write
      attestations: write
