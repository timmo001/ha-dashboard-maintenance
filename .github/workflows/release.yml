---
name: "Release"

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: "🚀 Release - Dashboard Maintenance"
    runs-on: ubuntu-latest
    steps:
      - name: "⬇️ Checkout the repository"
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: "🏗 Build frontend assets"
        run: pnpm run build
      - name: "⬆ Upload dashboard bundle to release"
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ha-dashboard-maintenance.js
